<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Story - 메뉴 아카이브</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 min-h-screen text-gray-800">

    <!-- 상단 내비게이션 바 -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-xl font-black text-blue-600 flex items-center gap-2">
                <i class="fa-solid fa-utensils"></i> Food Story
            </h1>
            <div id="nav-auth-area" class="flex items-center gap-3">
                <!-- 로그인 상태 및 모드 전환 버튼이 동적으로 들어감 -->
            </div>
        </div>
    </header>

    <!-- 메인 컨테이너 -->
    <main class="max-w-7xl mx-auto px-4 py-6">

        <!-- [모드 1] 고객(사용자)용 뷰어 화면 -->
        <div id="user-view" class="space-y-6">
            <!-- 카테고리 필터 탭 -->
            <div class="flex gap-2 overflow-x-auto pb-2 scrollbar-hide">
                <button onclick="filterCategory('전체')" class="cat-btn bg-blue-600 text-white px-4 py-2 rounded-full text-sm font-bold whitespace-nowrap shadow-sm transition">전체 메뉴</button>
                <button onclick="filterCategory('한식')" class="cat-btn bg-white text-gray-600 hover:bg-gray-100 px-4 py-2 rounded-full text-sm font-semibold whitespace-nowrap border shadow-sm transition">한식</button>
                <button onclick="filterCategory('양식/파스타')" class="cat-btn bg-white text-gray-600 hover:bg-gray-100 px-4 py-2 rounded-full text-sm font-semibold whitespace-nowrap border shadow-sm transition">양식/파스타</button>
                <button onclick="filterCategory('국물/찌개')" class="cat-btn bg-white text-gray-600 hover:bg-gray-100 px-4 py-2 rounded-full text-sm font-semibold whitespace-nowrap border shadow-sm transition">국물/찌개</button>
                <button onclick="filterCategory('사이드/안주')" class="cat-btn bg-white text-gray-600 hover:bg-gray-100 px-4 py-2 rounded-full text-sm font-semibold whitespace-nowrap border shadow-sm transition">사이드/안주</button>
                <button onclick="filterCategory('기타')" class="cat-btn bg-white text-gray-600 hover:bg-gray-100 px-4 py-2 rounded-full text-sm font-semibold whitespace-nowrap border shadow-sm transition">기타</button>
            </div>

            <!-- 메뉴 카드 그리드 (반응형: 모바일 1열, 태블릿 2열, PC 3열) -->
            <div id="menu-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <div class="col-span-full text-center py-20 text-gray-400">메뉴를 불러오는 중입니다...</div>
            </div>
        </div>

        <!-- [모드 2] 관리자 전용 등록/관리 화면 (초기엔 숨김) -->
        <div id="admin-view" class="hidden max-w-2xl mx-auto space-y-6">
            <div class="bg-white p-6 rounded-2xl shadow-sm border space-y-4">
                <div class="flex justify-between items-center border-b pb-3">
                    <h2 class="text-lg font-bold text-gray-900"><i class="fa-solid fa-pen-to-square text-blue-600 mr-2"></i>새 메뉴 등록</h2>
                    <span id="admin-email-display" class="text-xs text-gray-500 font-medium"></span>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-600 mb-1">카테고리</label>
                        <select id="reg-category" class="w-full border rounded-xl p-2.5 text-sm bg-gray-50 focus:outline-blue-500">
                            <option value="한식">한식</option>
                            <option value="양식/파스타">양식/파스타</option>
                            <option value="국물/찌개">국물/찌개</option>
                            <option value="사이드/안주">사이드/안주</option>
                            <option value="기타">기타</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-600 mb-1">메뉴 이름 *</label>
                        <input type="text" id="reg-name" placeholder="예: 매콤 크림 파스타" class="w-full border rounded-xl p-2.5 text-sm bg-gray-50 focus:outline-blue-500">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">메뉴 설명</label>
                    <textarea id="reg-desc" rows="2" placeholder="메뉴의 특징이나 맛 소개를 적어주세요." class="w-full border rounded-xl p-2.5 text-sm bg-gray-50 focus:outline-blue-500"></textarea>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-600 mb-1">사진 파일 직접 업로드</label>
                        <input type="file" id="reg-image-file" accept="image/*" class="w-full border rounded-xl p-2 text-xs bg-gray-50 file:mr-2 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-600 mb-1">동영상 링크 (유튜브 등)</label>
                        <input type="text" id="reg-video" placeholder="https://youtube.com/..." class="w-full border rounded-xl p-2.5 text-sm bg-gray-50 focus:outline-blue-500">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">레시피 및 조리 순서</label>
                    <textarea id="reg-recipe" rows="4" placeholder="1. 재료 손질하기&#10;2. 소스 붓고 끓이기..." class="w-full border rounded-xl p-2.5 text-sm bg-gray-50 focus:outline-blue-500 font-mono"></textarea>
                </div>

                <button id="save-menu-btn" onclick="saveMenu()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition shadow-sm text-sm">
                    메뉴 등록하기
                </button>
            </div>
        </div>

        <!-- [모드 3] 로그인 모달 (로그인 안 된 상태에서 관리자 전환 시) -->
        <div id="login-modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
            <div class="bg-white rounded-2xl p-6 w-full max-w-sm space-y-4 shadow-xl">
                <div class="flex justify-between items-center">
                    <h3 class="font-bold text-gray-900">관리자 로그인</h3>
                    <button onclick="toggleLoginModal(false)" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-lg"></i></button>
                </div>
                <div>
                    <input type="email" id="login-email" placeholder="이메일 입력" class="w-full border rounded-xl p-3 text-sm mb-3 bg-gray-50">
                    <input type="password" id="login-password" placeholder="비밀번호 입력" class="w-full border rounded-xl p-3 text-sm bg-gray-50">
                </div>
                <button onclick="processLogin()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl text-sm">로그인</button>
            </div>
        </div>

    </main>

    <!-- Firebase 및 서비스 로직 스크립트 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCM2jurmr57b5_iXV8FqzovSSnXwHeuHiQ",
            authDomain: "food-story-59a02.firebaseapp.com",
            projectId: "food-story-59a02",
            storageBucket: "food-story-59a02.firebasestorage.app",
            messagingSenderId: "173662312992",
            appId: "1:173662312992:web:729c9e77d2e2196eda7a45",
            measurementId: "G-QB10D1CSSC"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let allMenus = [];
        let currentCategory = '전체';

        // 인증 상태 감지
        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            updateNavUI();
        });

        // 상단 네비게이션 및 모드 전환 버튼 렌더링
        window.updateNavUI = function() {
            const navArea = document.getElementById('nav-auth-area');
            if (currentUser) {
                navArea.innerHTML = `
                    <button onclick="switchView('user')" id="btn-mode-user" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-gray-100 hover:bg-gray-200 text-gray-700 transition">사용자 화면</button>
                    <button onclick="switchView('admin')" id="btn-mode-admin" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-blue-600 text-white transition">관리자 등록</button>
                    <button onclick="processLogout()" class="text-gray-400 hover:text-red-500 p-1.5" title="로그아웃"><i class="fa-solid fa-arrow-right-from-bracket"></i></button>
                `;
                document.getElementById('admin-email-display').innerText = `관리자: ${currentUser.email}`;
            } else {
                navArea.innerHTML = `
                    <button onclick="switchView('user')" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-blue-600 text-white">메뉴 보기</button>
                    <button onclick="toggleLoginModal(true)" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-gray-100 hover:bg-gray-200 text-gray-700 transition"><i class="fa-solid fa-lock mr-1"></i> 관리자 로그인</button>
                `;
            }
        }

        // 화면 전환 함수 ('user' 또는 'admin')
        window.switchView = function(mode) {
            const userView = document.getElementById('user-view');
            const adminView = document.getElementById('admin-view');
            
            if (mode === 'admin') {
                if (!currentUser) {
                    toggleLoginModal(true);
                    return;
                }
                userView.classList.add('hidden');
                adminView.classList.remove('hidden');
            } else {
                adminView.classList.add('hidden');
                userView.classList.remove('hidden');
                loadMenus();
            }
        }

        window.toggleLoginModal = function(show) {
            const modal = document.getElementById('login-modal');
            if (show) modal.classList.remove('hidden');
            else modal.classList.add('hidden');
        }

        window.processLogin = async function() {
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value.trim();
            try {
                await signInWithEmailAndPassword(auth, email, password);
                toggleLoginModal(false);
                switchView('admin');
            } catch (e) {
                alert("로그인 실패: " + e.message);
            }
        }

        window.processLogout = async function() {
            await signOut(auth);
            switchView('user');
        }

        // 카테고리 필터링
        window.filterCategory = function(category) {
            currentCategory = category;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                if (btn.innerText.includes(category)) {
                    btn.className = "cat-btn bg-blue-600 text-white px-4 py-2 rounded-full text-sm font-bold whitespace-nowrap shadow-sm transition";
                } else {
                    btn.className = "cat-btn bg-white text-gray-600 hover:bg-gray-100 px-4 py-2 rounded-full text-sm font-semibold whitespace-nowrap border shadow-sm transition";
                }
            });
            renderMenus();
        }

        // 데이터베이스에서 메뉴 불러오기
        async function loadMenus() {
            try {
                const querySnapshot = await getDocs(collection(db, "menus"));
                allMenus = [];
                querySnapshot.forEach((docSnap) => {
                    allMenus.push({ id: docSnap.id, ...docSnap.data() });
                });
                renderMenus();
            } catch (e) {
                document.getElementById('menu-grid').innerHTML = `<p class="col-span-full text-center text-red-500 py-10">메뉴를 불러오지 못했습니다.</p>`;
            }
        }

        // 메뉴 화면에 그리기 (고객 중심 카드형 뷰)
        function renderMenus() {
            const grid = document.getElementById('menu-grid');
            const filtered = currentCategory === '전체' ? allMenus : allMenus.filter(m => m.category === currentCategory);

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-20 text-gray-400 bg-white rounded-2xl border">등록된 메뉴가 없습니다.</div>`;
                return;
            }

            grid.innerHTML = filtered.map(m => `
                <div class="bg-white rounded-2xl overflow-hidden shadow-sm border hover:shadow-md transition flex flex-col justify-between">
                    <div>
                        ${m.image ? `<img src="${m.image}" class="w-full h-48 object-cover" alt="메뉴 사진">` : `<div class="w-full h-48 bg-gray-100 flex items-center justify-center text-gray-300"><i class="fa-solid fa-image text-4xl"></i></div>`}
                        <div class="p-5 space-y-3">
                            <div class="flex justify-between items-start">
                                <span class="bg-blue-50 text-blue-600 text-xs font-bold px-2.5 py-1 rounded-lg">${m.category || '기타'}</span>
                                ${currentUser ? `<button onclick="deleteMenu('${m.id}')" class="text-gray-300 hover:text-red-500 text-xs p-1"><i class="fa-solid fa-trash-can"></i> 삭제</button>` : ''}
                            </div>
                            <h3 class="text-lg font-bold text-gray-900">${m.name}</h3>
                            <p class="text-sm text-gray-600 line-clamp-2">${m.description || '상세 설명이 없습니다.'}</p>
                        </div>
                    </div>
                    <div class="px-5 pb-5 pt-2 border-t bg-gray-50/50 space-y-2">
                        ${m.video ? `<a href="${m.video}" target="_blank" class="flex items-center gap-2 text-xs font-bold text-blue-600 hover:underline"><i class="fa-brands fa-youtube text-red-500 text-base"></i> 조리 동영상 시청하기</a>` : ''}
                        ${m.recipe ? `
                            <details class="group">
                                <summary class="cursor-pointer text-xs font-bold text-gray-700 flex justify-between items-center py-1">
                                    <span><i class="fa-solid fa-book-open text-amber-500 mr-1.5"></i> 레시피 보기</span>
                                    <i class="fa-solid fa-chevron-down text-gray-400 group-open:rotate-180 transition text-[10px]"></i>
                                </summary>
                                <div class="mt-2 p-3 bg-white rounded-xl border text-xs text-gray-700 whitespace-pre-line leading-relaxed font-mono">
                                    ${m.recipe}
                                </div>
                            </details>
                        ` : ''}
                    </div>
                </div>
            `).join('');
        }

        // 이미지 파일 직접 업로드 처리 (Base64 변환) 및 메뉴 저장
        window.saveMenu = async function() {
            const category = document.getElementById('reg-category').value;
            const name = document.getElementById('reg-name').value.trim();
            const description = document.getElementById('reg-desc').value.trim();
            const video = document.getElementById('reg-video').value.trim();
            const recipe = document.getElementById('reg-recipe').value.trim();
            const imageFile = document.getElementById('reg-image-file').files[0];

            if (!name) {
                alert("메뉴 이름은 필수 입력 항목입니다!");
                return;
            }

            const btn = document.getElementById('save-menu-btn');
            btn.innerText = "저장 중...";
            btn.disabled = true;

            try {
                let imageUrl = "";
                if (imageFile) {
                    imageUrl = await toBase64(imageFile);
                }

                await addDoc(collection(db, "menus"), {
                    category,
                    name,
                    description,
                    image: imageUrl,
                    video,
                    recipe,
                    createdAt: new Date()
                });

                // 입력폼 초기화
                document.getElementById('reg-name').value = "";
                document.getElementById('reg-desc').value = "";
                document.getElementById('reg-image-file').value = "";
                document.getElementById('reg-video').value = "";
                document.getElementById('reg-recipe').value = "";

                alert("메뉴가 성공적으로 등록되었습니다!");
                switchView('user');
            } catch (e) {
                alert("저장 실패: " + e.message);
            } finally {
                btn.innerText = "메뉴 등록하기";
                btn.disabled = false;
            }
        }

        // 파일을 Base64 문자열로 변환하는 헬퍼 함수
        function toBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        // 메뉴 삭제 함수
        window.deleteMenu = async function(id) {
            if (confirm("정말 이 메뉴를 삭제하시겠습니까?")) {
                try {
                    await deleteDoc(doc(db, "menus", id));
                    loadMenus();
                } catch (e) {
                    alert("삭제 실패: " + e.message);
                }
            }
        }

        // 최초 접속 시 메뉴 로드
        loadMenus();
    </script>
</body>
</html>
