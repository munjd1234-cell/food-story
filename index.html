<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Story - 메뉴 아카이브 관리자</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center py-10 px-4">

    <div class="bg-white p-6 md:p-8 rounded-lg shadow-md w-full max-w-2xl">
        <h1 class="text-2xl font-bold mb-6 text-center text-gray-800">Food Story 메뉴 상세 아카이브</h1>
        
        <!-- 로그인 전 폼 -->
        <div id="login-form" class="space-y-4">
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2" for="email">이메일</label>
                <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="email" type="email" placeholder="이메일 입력">
            </div>
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2" for="password">비밀번호</label>
                <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 mb-3 leading-tight focus:outline-none focus:shadow-outline" id="password" type="password" placeholder="비밀번호 입력">
            </div>
            <button id="login-btn" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline w-full" type="button">
                로그인
            </button>
        </div>

        <!-- 로그인 후 대시보드 -->
        <div id="dashboard" class="hidden space-y-6">
            <div class="flex justify-between items-center bg-gray-50 p-4 rounded-md border">
                <span id="user-email" class="text-gray-700 text-sm font-medium"></span>
                <button id="logout-btn" class="bg-red-500 hover:bg-red-600 text-white text-sm font-bold py-1.5 px-3 rounded focus:outline-none" type="button">
                    로그아웃
                </button>
            </div>

            <!-- 새 메뉴 상세 등록 폼 -->
            <div class="bg-blue-50 p-4 rounded-md border border-blue-100 space-y-4">
                <h2 class="text-md font-bold text-blue-800">새 메뉴 상세 등록</h2>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-gray-600 mb-1">카테고리</label>
                        <select id="menu-category" class="shadow border rounded w-full py-2 px-3 text-gray-700 text-sm focus:outline-none">
                            <option value="한식">한식</option>
                            <option value="양식/파스타">양식/파스타</option>
                            <option value="국물/찌개">국물/찌개</option>
                            <option value="사이드/안주">사이드/안주</option>
                            <option value="기타">기타</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-600 mb-1">메뉴 이름</label>
                        <input type="text" id="menu-name" placeholder="예: 새우감바스" class="shadow border rounded w-full py-2 px-3 text-gray-700 text-sm focus:outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">메뉴 설명</label>
                    <textarea id="menu-desc" rows="2" placeholder="메뉴의 특징이나 맛 소개" class="shadow border rounded w-full py-2 px-3 text-gray-700 text-sm focus:outline-none"></textarea>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-gray-600 mb-1">사진 이미지 URL</label>
                        <input type="text" id="menu-image" placeholder="이미지 링크 주소 입력" class="shadow border rounded w-full py-2 px-3 text-gray-700 text-sm focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-600 mb-1">동영상 링크 (유튜브 등)</label>
                        <input type="text" id="menu-video" placeholder="유튜브 링크 주소 입력" class="shadow border rounded w-full py-2 px-3 text-gray-700 text-sm focus:outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">레시피 및 조리 순서</label>
                    <textarea id="menu-recipe" rows="3" placeholder="1. 재료 준비...&#10;2. 조리 방법..." class="shadow border rounded w-full py-2 px-3 text-gray-700 text-sm focus:outline-none"></textarea>
                </div>

                <button id="add-menu-btn" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded w-full text-sm">메뉴 및 레시피 저장</button>
            </div>

            <!-- 등록된 메뉴 목록 아카이브 -->
            <div>
                <h2 class="text-md font-bold text-gray-700 mb-3">등록된 메뉴 아카이브</h2>
                <div id="menu-list" class="space-y-4">
                    <p class="text-gray-400 text-sm text-center py-4">메뉴를 불러오는 중...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK (Modular) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCM2jurmr57b5_iXV8FqzovSSnXwHeuHiQ",
            authDomain: "food-story-59a02.firebaseapp.com",
            projectId: "food-story-59a02",
            storageBucket: "food-story-59a02.firebasestorage.app",
            messagingSenderId: "173662312992",
            appId: "1:173662312992:web:729c9e77d2e2196eda7a45",
            measurementId: "G-QB10D1CSSC"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const loginForm = document.getElementById('login-form');
        const dashboard = document.getElementById('dashboard');
        const loginBtn = document.getElementById('login-btn');
        const logoutBtn = document.getElementById('logout-btn');
        const userEmailText = document.getElementById('user-email');
        const addMenuBtn = document.getElementById('add-menu-btn');
        const menuListDiv = document.getElementById('menu-list');

        loginBtn.addEventListener('click', () => {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            signInWithEmailAndPassword(auth, email, password)
                .catch((error) => alert("로그인 실패: " + error.message));
        });

        logoutBtn.addEventListener('click', () => { signOut(auth); });

        onAuthStateChanged(auth, (user) => {
            if (user) {
                loginForm.classList.add('hidden');
                dashboard.classList.remove('hidden');
                userEmailText.innerText = `${user.email} (관리자)`;
                loadMenus();
            } else {
                loginForm.classList.remove('hidden');
                dashboard.classList.add('hidden');
            }
        });

        // 상세 메뉴 등록
        addMenuBtn.addEventListener('click', async () => {
            const category = document.getElementById('menu-category').value;
            const name = document.getElementById('menu-name').value.trim();
            const description = document.getElementById('menu-desc').value.trim();
            const image = document.getElementById('menu-image').value.trim();
            const video = document.getElementById('menu-video').value.trim();
            const recipe = document.getElementById('menu-recipe').value.trim();

            if (!name) {
                alert("메뉴 이름은 필수 입력 항목입니다!");
                return;
            }

            try {
                await addDoc(collection(db, "menus"), {
                    category,
                    name,
                    description,
                    image,
                    video,
                    recipe,
                    createdAt: new Date()
                });

                // 입력폼 초기화
                document.getElementById('menu-name').value = "";
                document.getElementById('menu-desc').value = "";
                document.getElementById('menu-image').value = "";
                document.getElementById('menu-video').value = "";
                document.getElementById('menu-recipe').value = "";

                loadMenus();
            } catch (e) {
                alert("메뉴 저장 중 오류 발생: " + e.message);
            }
        });

        // 메뉴 목록 불러오기 (카드 형태 상세 출력)
        async function loadMenus() {
            try {
                const querySnapshot = await getDocs(collection(db, "menus"));
                menuListDiv.innerHTML = "";
                if (querySnapshot.empty) {
                    menuListDiv.innerHTML = `<p class="text-gray-400 text-sm text-center py-3">등록된 메뉴가 없습니다.</p>`;
                    return;
                }
                querySnapshot.forEach((documentItem) => {
                    const data = documentItem.data();
                    const itemCard = document.createElement('div');
                    itemCard.className = "bg-white p-4 rounded-lg border shadow-sm space-y-2";
                    
                    let imageHtml = data.image ? `<img src="${data.image}" alt="메뉴 사진" class="w-full h-40 object-cover rounded mb-2">` : '';
                    let videoHtml = data.video ? `<a href="${data.video}" target="_blank" class="text-blue-500 text-xs underline block">🎥 관련 동영상 링크 시청하기</a>` : '';
                    let recipeHtml = data.recipe ? `<div class="bg-gray-50 p-2.5 rounded text-xs text-gray-700 whitespace-pre-line mt-2"><strong>[레시피]</strong><br>${data.recipe}</div>` : '';

                    itemCard.innerHTML = `
                        <div class="flex justify-between items-start">
                            <div>
                                <span class="bg-blue-100 text-blue-800 text-xs font-semibold px-2 py-0.5 rounded">${data.category || '기타'}</span>
                                <h3 class="text-lg font-bold text-gray-800 mt-1">${data.name}</h3>
                            </div>
                            <button onclick="deleteMenu('${documentItem.id}')" class="bg-red-100 hover:bg-red-200 text-red-600 text-xs font-bold py-1 px-2.5 rounded">삭제</button>
                        </div>
                        ${imageHtml}
                        <p class="text-sm text-gray-600">${data.description || '설명이 없습니다.'}</p>
                        ${videoHtml}
                        ${recipeHtml}
                    `;
                    menuListDiv.appendChild(itemCard);
                });
            } catch (e) {
                menuListDiv.innerHTML = `<p class="text-red-500 text-sm text-center">메뉴를 불러오지 못했습니다.</p>`;
            }
        }

        window.deleteMenu = async function(id) {
            if (confirm("정말 이 메뉴를 삭제하시겠습니까?")) {
                try {
                    await deleteDoc(doc(db, "menus", id));
                    loadMenus();
                } catch (e) {
                    alert("삭제 실패: " + e.message);
                }
            }
        }
    </script>
</body>
</html>
