<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Story - Admin</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col justify-center items-center">

    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
        <h1 class="text-2xl font-bold mb-6 text-center text-gray-800">Food Story 관리자 로그인</h1>
        
        <div id="login-form">
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="email">이메일</label>
                <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="email" type="email" placeholder="이메일 입력">
            </div>
            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="password">비밀번호</label>
                <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 mb-3 leading-tight focus:outline-none focus:shadow-outline" id="password" type="password" placeholder="비밀번호 입력">
            </div>
            <div class="flex items-center justify-between">
                <button id="login-btn" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline w-full" type="button">
                    로그인
                </button>
            </div>
        </div>

        <div id="dashboard" class="hidden">
            <p class="text-green-600 font-bold mb-4 text-center">로그인 되었습니다!</p>
            <p id="user-email" class="text-gray-600 mb-4 text-center"></p>
            <button id="logout-btn" class="bg-red-500 hover:bg-red-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline w-full" type="button">
                로그아웃
            </button>
        </div>
    </div>

    <!-- Firebase SDK (Modular) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // 파이어베이스 프로젝트 설정값 (새로 발급받은 값 적용 완료)
        const firebaseConfig = {
            apiKey: "AIzaSyCM2jurmr57b5_iXV8FqzovSSnXwHeuHiQ",
            authDomain: "food-story-59a02.firebaseapp.com",
            projectId: "food-story-59a02",
            storageBucket: "food-story-59a02.firebasestorage.app",
            messagingSenderId: "173662312992",
            appId: "1:173662312992:web:729c9e77d2e2196eda7a45",
            measurementId: "G-QB10D1CSSC"
        };

        // Firebase 초기화
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const loginForm = document.getElementById('login-form');
        const dashboard = document.getElementById('dashboard');
        const loginBtn = document.getElementById('login-btn');
        const logoutBtn = document.getElementById('logout-btn');
        const userEmailText = document.getElementById('user-email');

        // 로그인 버튼 클릭 이벤트
        loginBtn.addEventListener('click', () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            signInWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    // 로그인 성공
                    console.log("로그인 성공:", userCredential.user);
                })
                .catch((error) => {
                    alert("로그인 실패: " + error.message);
                });
        });

        // 로그아웃 버튼 클릭 이벤트
        logoutBtn.addEventListener('click', () => {
            signOut(auth).then(() => {
                console.log("로그아웃 성공");
            }).catch((error) => {
                console.error("로그아웃 오류", error);
            });
        });

        // 인증 상태 모니터링 (로그인 여부에 따라 화면 전환)
        onAuthStateChanged(auth, (user) => {
            if (user) {
                loginForm.classList.add('hidden');
                dashboard.classList.remove('hidden');
                userEmailText.innerText = `접속 계정: ${user.email}`;
            } else {
                loginForm.classList.remove('hidden');
                dashboard.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
